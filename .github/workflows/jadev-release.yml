name: JADEV release

# Push a tag such as v1.0.0 on main: the checks run, @jadev-corp/lavish is published to npm through
# trusted publishing (OIDC with provenance, no token), and a GitHub release carries the packed .tgz.
# See "Releases" in docs/jadev-fork.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'JADEV-CORP/lavish-axi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "${GITHUB_REF_NAME} is not on main"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: pnpm run check
      - run: npm pack
      # Skipped when this version is already on npm (the hand-published 1.0.0, or a rerun after a
      # failed release step), so the GitHub release still gets created.
      - name: Publish to npm
        run: |
          if npm view "@jadev-corp/lavish@${VERSION}" version >/dev/null 2>&1; then
            echo "@jadev-corp/lavish@${VERSION} is already on npm"
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "jadev-corp-lavish-${VERSION}.tgz" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install: \`npm i -g @jadev-corp/lavish@${VERSION}\`. Changes: see CHANGELOG.md."
